<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        :root {
            --pink-primary: #ec4899;
            --pink-dark: #db2777;
            --pink-light: #fbcfe8;
            --pink-soft: #fdf2f8;
        }
        
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { 
            background: linear-gradient(135deg, rgba(236,72,153,0.1) 0%, rgba(244,114,182,0.1) 100%);
            color: #ec4899; 
            border-left: 3px solid #ec4899;
        }
        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(236,72,153,0.15) 0%, rgba(244,114,182,0.15) 100%);
            font-weight: 600;
        }
        .card-stat { transition: transform 0.2s, box-shadow 0.2s; }
        .card-stat:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(236,72,153,0.15); }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fce7f3; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 3px; }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-table th {
            background: #fdf2f8;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 13px;
            color: #be185d;
            border-bottom: 2px solid #fbcfe8;
            text-align: left;
        }
        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #fce7f3;
            font-size: 14px;
        }
        .data-table tr:hover td { background: #fdf2f8; }
        
        .badge-status {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-aktif { background: #d1fae5; color: #065f46; }
        .badge-tidak-aktif { background: #fee2e2; color: #991b1b; }
        .badge-hadir { background: #d1fae5; color: #065f46; }
        .badge-izin { background: #fef3c7; color: #92400e; }
        .badge-sakit { background: #dbeafe; color: #1e40af; }
        .badge-alpha { background: #fee2e2; color: #991b1b; }
        
        .btn-action {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-delete { background: #fee2e2; color: #e11d48; }
        .btn-delete:hover { background: #fecdd3; }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-pink-50 via-white to-pink-50 text-slate-800 overflow-hidden">

    <!-- Login Screen -->

        async function createRecord(data) {
            const newRecord = { ...data, __backendId: Date.now() + '-' + Math.random() };
            allData.push(newRecord);
            localStorage.setItem('payrollData', JSON.stringify(allData));
            return newRecord;
        }

        async function deleteRecord(record) {
            const index = allData.findIndex(d => d.__backendId === record.__backendId);
            if (index !== -1) {
                allData.splice(index, 1);
                localStorage.setItem('payrollData', JSON.stringify(allData));
            }
        }

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            initData();
            if (u === 'hrd' && p === 'hrd123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                renderDashboard();
                lucide.createIcons();
            } else {
                alert('Username atau password salah!');
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        });

        // Navigation
        document.querySelectorAll('.sidebar-item[data-page]').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentPage = item.dataset.page;
                document.getElementById('page-title').textContent = item.textContent.trim();
                renderPage(currentPage);
                lucide.createIcons();
            });
        });

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 px-4 py-2 rounded-lg shadow-lg text-white text-sm z-50 fade-in';
            toast.style.background = isError ? '#db2777' : '#ec4899';
            toast.innerHTML = `<i data-lucide="${isError ? 'alert-circle' : 'check-circle'}" class="w-4 h-4 inline mr-2"></i>${message}`;
            document.body.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 3000);
        }

        // Render Dashboard

        // Generate Gaji
        function renderGenerate() {
            const pegawai = getByType('pegawai');
            const periode = getByType('periode');
            const tunjangan = getByType('tunjangan');
            const potongan = getByType('potongan');
            const totalTunjangan = tunjangan.reduce((s, t) => s + (t.tunjangan || 0), 0);
            const totalPotongan = potongan.reduce((s, t) => s + (t.potongan || 0), 0);
            const content = document.getElementById('content-area');
            content.innerHTML = `
                <div class="fade-in">
                    <div class="bg-white rounded-xl border border-pink-100 p-5 shadow-sm">
                        <h3 class="font-semibold mb-4">Generate Gaji</h3>
                        <div class="bg-pink-50 rounded-lg p-3 mb-4 text-sm">
                            <div class="flex justify-between"><span>Total Tunjangan:</span><span class="text-green-600 font-semibold">${formatRp(totalTunjangan)}</span></div>
                            <div class="flex justify-between"><span>Total Potongan:</span><span class="text-red-600 font-semibold">${formatRp(totalPotongan)}</span></div>
                        </div>
                        <form id="form-generate" class="space-y-3">
                            <select id="periode_gaji" class="w-full px-3 py-2 border border-pink-200 rounded-lg"><option value="">Pilih Periode</option>${periode.map(p => `<option value="${p.periode}">${p.periode}</option>`).join('')}</select>
                            <button type="submit" class="w-full bg-pink-600 text-white py-2 rounded-lg font-semibold hover:bg-pink-700">Generate Gaji</button>
                        </form>
                        <div id="gen-result" class="mt-3"></div>
                    </div>
                </div>
            `;
            document.getElementById('form-generate').addEventListener('submit', async (e) => {
                e.preventDefault();
                const periode = document.getElementById('periode_gaji').value;
                if (!periode) { showToast('Pilih periode!', true); return; }
                const existing = getByType('gaji').filter(g => g.periode === periode);
                for (const g of existing) await deleteRecord(g);
                const tunj = getByType('tunjangan').reduce((s, t) => s + (t.tunjangan || 0), 0);
                const pot = getByType('potongan').reduce((s, t) => s + (t.potongan || 0), 0);
                for (const p of pegawai.filter(p => p.status === 'aktif')) {
                    const total = (p.gaji_pokok || 0) + tunj - pot;
                    await createRecord({ type: 'gaji', name: p.name, nip: p.nip, jabatan: p.jabatan, gaji_pokok: p.gaji_pokok, tunjangan: tunj, potongan: pot, total_gaji: total, periode: periode, status: 'Dibayar', tanggal: new Date().toISOString().split('T')[0] });
                }
                document.getElementById('gen-result').innerHTML = `<p class="text-green-600 text-sm bg-green-50 p-2 rounded-lg">✓ Berhasil generate gaji ${pegawai.filter(p => p.status === 'aktif').length} pegawai</p>`;
                showToast('Gaji berhasil digenerate!');
            });
        }

                        <div class="overflow-x-auto"><table class="data-table"><thead><tr><th>Nama</th><th>Jabatan</th><th>Periode</th><th>Gaji Pokok</th><th>Tunjangan</th><th>Potongan</th><th>Total</th></tr></thead>
                        <tbody>${data.map(g => `<tr><td class="font-medium">${g.name}</td><td>${g.jabatan}</td><td>${g.periode}</td><td>${formatRp(g.gaji_pokok)}</td><td class="text-green-600">${formatRp(g.tunjangan)}</td><td class="text-red-600">${formatRp(g.potongan)}</td><td class="font-bold text-pink-600">${formatRp(g.total_gaji)}</td></tr>`).join('')}</tbody></table></div>`}
                        <button onclick="window.print()" class="mt-4 bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-medium"><i data-lucide="printer" class="w-4 h-4 inline mr-2"></i> Cetak Laporan</button>
                    </div>
                </div>
            `;
        }

        // Laporan Absensi
        function renderLapAbsensi() {
            const data = getByType('absensi');
            const hadir = data.filter(d => d.status === 'Hadir').length;
            const izin = data.filter(d => d.status === 'Izin').length;
            const sakit = data.filter(d => d.status === 'Sakit').length;
            const content = document.getElementById('content-area');
            content.innerHTML = `
                <div class="fade-in">
                    <div class="grid grid-cols-3 gap-3 mb-4"><div class="bg-green-50 p-3 text-center rounded-lg"><p class="text-2xl font-bold text-green-700">${hadir}</p><p class="text-xs">Hadir</p></div>
                    <div class="bg-yellow-50 p-3 text-center rounded-lg"><p class="text-2xl font-bold text-yellow-700">${izin}</p><p class="text-xs">Izin</p></div>
                    <div class="bg-blue-50 p-3 text-center rounded-lg"><p class="text-2xl font-bold text-blue-700">${sakit}</p><p class="text-xs">Sakit</p></div></div>
                    <div class="bg-white rounded-xl border border-pink-100 p-5 shadow-sm">
                        <h3 class="font-semibold mb-3">📊 Laporan Absensi</h3>
                        ${data.length === 0 ? '<p class="text-slate-400 text-center py-8">Belum ada data absensi.</p>' : `
                        <div class="overflow-x-auto"><table class="data-table"><thead><tr><th>Tanggal</th><th>Nama</th><th>Status</th></tr></thead>
                        <tbody>${data.map(a => `<tr><td>${a.tanggal}</td><td class="font-medium">${a.name}</td><td><span class="badge-status ${a.status === 'Hadir' ? 'badge-aktif' : a.status === 'Sakit' ? 'badge-sakit' : 'badge-izin'}">${a.status}</span></td></tr>`).join('')}</tbody></table></div>`}
                        <button onclick="window.print()" class="mt-4 bg-pink-600 text-white px-4 py-2 rounded-lg text-sm font-medium"><i data-lucide="printer" class="w-4 h-4 inline mr-2"></i> Cetak Laporan</button>
                    </div>
                </div>
            `;
        }

        // Pengaturan
        function renderPengaturan() {
            const content = document.getElementById('content-area');
            content.innerHTML = `
                <div class="fade-in">
                    <div class="bg-white rounded-xl border border-pink-100 p-5 shadow-sm">
                        <h3 class="font-semibold mb-4">⚙️ Pengaturan Sistem</h3>
                        <div class="space-y-4"><div class="flex justify-between py-3 border-b"><div><p class="font-medium">Nama Aplikasi</p><p class="text-xs text-slate-400">Payroll Management System</p></div><span class="text-pink-600 font-semibold">v2.0.0</span></div>
                        <div class="flex justify-between py-3 border-b"><div><p class="font-medium">Perusahaan</p><p class="text-xs text-slate-400">PT Iskandar Anita</p></div><span class="text-pink-600">✅ Terdaftar</span></div>
                        <div class="flex justify-between py-3"><div><p class="font-medium">Tema</p><p class="text-xs text-slate-400">Warna Pink</p></div><div class="w-6 h-6 bg-pink-500 rounded-full shadow"></div></div></div>
                        <button onclick="localStorage.removeItem('payrollData'); location.reload();" class="mt-4 w-full bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600">Reset Data</button>
                    </div>
                </div>
            `;
        }

        window.deleteItem = async (id) => { const r = allData.find(d => d.__backendId === id); if (r) await deleteRecord(r); showToast('Data dihapus!'); renderPage(currentPage); };
        function renderPage(page) { const pages = { dashboard: renderDashboard, pegawai: renderPegawai, jabatan: renderJabatan, absensi: renderAbsensi, periode: renderPeriode, generate: renderGenerate, 'data-gaji': renderDataGaji, potongan: renderPotongan, tunjangan: renderTunjangan, 'lap-gaji': renderLapGaji, 'lap-absensi': renderLapAbsensi, pengaturan: renderPengaturan }; if (pages[page]) pages[page](); else document.getElementById('content-area').innerHTML = '<p class="text-slate-400">Halaman tidak ditemukan.</p>'; lucide.createIcons(); }

        initData();
        lucide.createIcons();
    </script>
</body>
</html>
